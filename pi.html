<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reveal digits of pi one at a time." />
  <title>The Pi Project — Jatin Pandey</title>
  <link rel="stylesheet" href="/styles/poolsuite.css" />
  <script src="/analytics.js"></script>
</head>
<body class="pi-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar"><a class="site-name" href="/">jatin pandey</a></header>

  <main class="pi-shell" id="main">
    <header class="pi-heading">
      <h1>The Pi Project</h1>
      <p>Reveal digits of π one at a time. Oddly meditative, and you learn the greatest party trick in the world right after reciting the alphabet backwards.</p>
    </header>

    <section class="pi-console" aria-label="Pi digit generator">
      <div class="pi-box">
        <div id="pi-display" aria-label="Revealed digits of pi">
          <span class="prefix">3.</span><span class="digits" id="digits-span"></span>
        </div>
        <div class="pi-status"><div id="count" aria-live="polite">0 / &#8734;</div></div>
      </div>
      <div class="pi-controls">
        <button id="tap-btn" type="button">+ 1 digit of π</button>
      </div>
    </section>
  </main>

  <footer>
    <span>taste refinement parmo dharma.</span>
    <a class="footer-social" href="https://x.com/jatinpandey" aria-label="Jatin Pandey on X"><span aria-hidden="true">· 𝕏</span><span>@jatinpandey</span></a>
  </footer>

  <script>
    const PI_DIGITS =
      "1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679" +
      "8214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196" +
      "4428810975665933446128475648233786783165271201909145648566923460348610454326648213393607260249141273" +
      "7245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094" +
      "3305727036575959195309218611738193261179310511854807446237996274956735188575272489122793818301194912" +
      "9833673362440656643086021394946395224737190702179860943702770539217176293176752384674818467669405132" +
      "0005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235" +
      "4201995611212902196086403441815981362977477130996051870721134999999837297804995105973173281609631859" +
      "5024459455346908302642522308253344685035261931188171010003137838752886587533208381420617177669147303" +
      "5982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989";

    let revealed = 0;
    const digitsSpan = document.getElementById('digits-span');
    const countEl = document.getElementById('count');
    const button = document.getElementById('tap-btn');
    const display = document.getElementById('pi-display');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function animateDigit(element) {
      if (reducedMotion.matches) return;
      const rect = element.getBoundingClientRect();
      const deltaX = (window.innerWidth / 2) - (rect.left + rect.width / 2);
      const deltaY = (window.innerHeight / 2) - (rect.top + rect.height / 2);
      element.animate([
        { transform: `translate3d(${deltaX}px, ${deltaY}px, 260px) scale(8)`, opacity: 0 },
        { transform: 'translate3d(0, 0, 0) scale(1)', opacity: 1 }
      ], { duration: 180, easing: 'ease-out' });
    }

    function reveal() {
      if (revealed >= PI_DIGITS.length) return;
      revealed += 1;
      const previous = PI_DIGITS.slice(0, revealed - 1);
      const current = PI_DIGITS[revealed - 1];
      digitsSpan.innerHTML = previous + '<span class="current-digit">' + current + '</span>';
      countEl.textContent = revealed + ' / \u221E';
      display.scrollTop = display.scrollHeight;
      animateDigit(digitsSpan.querySelector('.current-digit'));
    }

    button.addEventListener('click', reveal);
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && event.target !== button) {
        event.preventDefault();
        reveal();
      }
    });
  </script>
  <script src="/motion.js"></script>
</body>
</html>
