    <path d="M212 180 C192 146 232 130 212 90"/>
    <path d="M254 186 C234 156 274 140 254 104"/>
  </g>
  <text x="200" y="458" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#2f4fa0" text-anchor="middle">slow mornings</text>
</g><rect width="400" height="500" filter="url(#grain)" opacity="0.7" style="mix-blend-mode:multiply"/></svg>