    <path d="M330 420 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/>
  </g>
</g>
<g style="mix-blend-mode:multiply">
  <ellipse cx="200" cy="370" rx="152" ry="36" fill="none" stroke="#2f4fa0" stroke-width="4"/>
  <path d="M232 232 L297 225 L273 348 Q250 358 226 364 Z" fill="url(#dotB)"/>
  <path d="M103 225 L127 348 Q200 378 273 348 L297 225 Z" fill="none" stroke="#2f4fa0" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="200" cy="225" rx="97" ry="25" fill="none" stroke="#2f4fa0" stroke-width="5"/>
  <ellipse cx="200" cy="228" rx="82" ry="17" fill="#2f4fa0"/>
  <path d="M200 240 C176 226 181 212 193 214 C198 215 200 220 200 222 C200 220 202 215 207 214 C219 212 224 226 200 240 Z" fill="#f3eee2"/>
  <path d="M296 250 C352 244 352 322 280 320" fill="none" stroke="#2f4fa0" stroke-width="12" stroke-linecap="round"/>
  <g fill="none" stroke="#2f4fa0" stroke-width="5" stroke-linecap="round">
