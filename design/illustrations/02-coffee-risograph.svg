  <path d="M103 225 L127 348 Q200 378 273 348 L297 225 Z" fill="#f3eee2"/>
  <ellipse cx="200" cy="225" rx="97" ry="25" fill="#f3eee2"/>
  <path d="M296 250 C352 244 352 322 280 320" fill="none" stroke="#f3eee2" stroke-width="16"/>
  <g fill="#ff4fae">
    <path d="M62 120 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 Z"/>
